
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Watchlist Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

  <!-- Login page -->
  <section id="loginView"
    class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md rounded-2xl border border-slate-700
                bg-slate-900 p-8 shadow-2xl">

      <div class="mb-8 text-center">
        <div class="mb-4 text-5xl">🎬</div>
        <h1 class="text-3xl font-bold">
          Movie<span class="text-amber-400">Watch</span>
        </h1>
        <p class="mt-2 text-slate-400">Your personal movie collection</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="email" class="mb-2 block">Email address</label>
          <input id="email" type="email" required
            placeholder="you@example.com"
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3">
        </div>

        <div>
          <label for="password" class="mb-2 block">Password</label>
          <input id="password" type="password" required
            placeholder="Enter your password"
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3">
        </div>

        <p id="errorMessage" class="hidden text-sm text-red-400"
          role="alert"></p>

        <button type="submit"
          class="w-full rounded-lg bg-amber-400 px-4 py-3
                 font-bold text-slate-950 hover:bg-amber-300">
          Sign In
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Movie Watchlist Dashboard · Team Project
      </p>
    </div>
  </section>


  <!-- Main dashboard -->
  <main id="dashboardView" class="hidden min-h-screen p-5 md:p-8">

    <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">
          Movie<span class="text-amber-400">Watch</span>
        </h1>
        <p class="mt-2 text-slate-400">
          Your movies, your watchlist, your next favorite film.
        </p>
      </div>

      <button id="logoutButton" type="button"
        class="rounded-lg bg-amber-400 px-5 py-3
               font-bold text-slate-950 hover:bg-amber-300">
        Log Out
      </button>
    </header>


    <!-- Dashboard statistics -->
    <section class="mb-8 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">

      <article class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
        <p class="text-sm text-slate-400">Total Runtime Watched</p>
        <p id="totalRuntime" class="mt-3 text-3xl font-bold text-amber-400">
          0 min
        </p>
      </article>

      <article class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
        <p class="text-sm text-slate-400">Average Rating</p>
        <p id="averageRating" class="mt-3 text-3xl font-bold text-amber-400">
          0.0/10
        </p>
      </article>

      <article class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
        <p class="text-sm text-slate-400">Unwatched Titles</p>
        <p id="unwatchedCount" class="mt-3 text-3xl font-bold text-amber-400">
          0
        </p>
      </article>

    </section>


    <!-- Search and filters -->
    <section class="mb-8 rounded-2xl border border-slate-800
                    bg-slate-900 p-5">

      <h2 class="mb-4 text-2xl font-bold">My Watchlist</h2>

      <div class="grid gap-4 md:grid-cols-3">

        <div>
          <label for="searchInput" class="mb-2 block text-sm font-medium">
            Search movies
          </label>
          <input id="searchInput" type="search"
            placeholder="Search by movie title..."
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3">
        </div>

        <div>
          <label for="genreFilter" class="mb-2 block text-sm font-medium">
            Filter by genre
          </label>
          <select id="genreFilter"
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3">
            <option value="all">All Genres</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Animation">Animation</option>
            <option value="Documentary">Documentary</option>
            <option value="Horror">Horror</option>
          </select>
        </div>

        <div>
          <label for="statusFilter" class="mb-2 block text-sm font-medium">
            Filter by status
          </label>
          <select id="statusFilter"
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3">
            <option value="all">All Titles</option>
            <option value="watched">Watched</option>
            <option value="unwatched">Unwatched</option>
          </select>
        </div>

      </div>

      <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
        <p id="resultCount" class="text-sm text-slate-400"
          aria-live="polite">12 titles found</p>

        <button id="clearFilters" type="button"
          class="text-sm font-semibold text-amber-400">
          Clear Search and Filters
        </button>
      </div>
    </section>


    <!-- Movie cards -->
    <section>
      <div id="movieGrid"
        class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
      </div>
    </section>


    <!-- Add a new title -->
    <section class="mt-10 rounded-2xl border border-slate-800
                    bg-slate-900 p-5">

      <h2 class="text-2xl font-bold">Add a New Title</h2>

      <form id="addTitleForm" class="mt-5 grid gap-4 md:grid-cols-2">

        <div>
          <label for="titleInput">Movie or Show Title</label>
          <input id="titleInput" type="text" required maxlength="100"
            class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
        </div>

        <div>
          <label for="genreInput">Genre</label>
          <select id="genreInput" required
            class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
            <option value="">Choose a genre</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Animation">Animation</option>
            <option value="Documentary">Documentary</option>
            <option value="Horror">Horror</option>
          </select>
        </div>

        <div>
          <label for="runtimeInput">Runtime in minutes</label>
          <input id="runtimeInput" type="number" min="1" step="1" required
            class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
        </div>

        <div>
          <label for="ratingInput">Rating (0–10)</label>
          <input id="ratingInput" type="number" min="0" max="10"
            step="0.1" value="0" required
            class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
        </div>

        <label class="flex items-center gap-2 md:col-span-2">
          <input id="watchedInput" type="checkbox">
          I have already watched this title
        </label>

        <div class="flex flex-wrap gap-3 md:col-span-2">
          <button type="reset"
            class="rounded-lg border border-slate-700 px-5 py-3">
            Clear Form
          </button>

          <button type="submit"
            class="rounded-lg bg-amber-400 px-5 py-3
                   font-bold text-slate-950">
            Add Title
          </button>
        </div>

        <p id="formMessage" class="md:col-span-2"
          aria-live="polite"></p>
      </form>
    </section>

  </main>

  <script src="./movie.js"></script>
  <script src="./login.js"></script>
</body>
</html>
