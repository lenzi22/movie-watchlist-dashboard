
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Watchlist Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

  <!-- LOGIN VIEW -->
  <section id="loginView"
    class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md rounded-2xl border border-slate-700
                bg-slate-900 p-8 shadow-2xl">

      <div class="mb-8 text-center">
        <div class="mb-4 text-5xl">🎬</div>

        <h1 class="text-3xl font-bold">
          Movie<span class="text-amber-400">Watch</span>
        </h1>

        <p class="mt-2 text-slate-400">
          Your personal movie collection
        </p>
      </div>

      <form id="loginForm" class="space-y-5">

        <div>
          <label for="email"
            class="mb-2 block text-sm font-medium">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3 outline-none
                   focus:border-amber-400"
          >
        </div>

        <div>
          <label for="password"
            class="mb-2 block text-sm font-medium">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3 outline-none
                   focus:border-amber-400"
          >
        </div>

        <p id="errorMessage"
          class="hidden text-sm text-red-400"
          role="alert">
        </p>

        <button
          type="submit"
          class="w-full rounded-lg bg-amber-400 px-4 py-3
                 font-bold text-slate-950 transition
                 hover:bg-amber-300">
          Sign In
        </button>

      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Movie Watchlist Dashboard · Team Project
      </p>

    </div>
  </section>


  <!-- DASHBOARD VIEW: WE WILL BUILD THIS LATER -->
  <section id="dashboardView" class=" hidden min-h-screen p-8">

    <h1 class="  text-3xl font-bold">
      Welcome to your Movie Watchlist!
    </h1>

    <p class=" flex justify-end dmt-3 text-slate-400">
      Login successful. We will build the dashboard features here.
    </p>

    <button
      id="logoutButton"
      class="flex justify-end  mt-6 rounded-lg bg-amber-400 px-5 py-3
             font-bold text-slate-950 hover:bg-amber-300">
      Log Out
    </button>

    <!-- DASHBOARD -->
     <section class="mt-8 rounded-2xl border border-slate-800 bg-slate-900 p-5">

  <h2 class="text-2xl font-bold">My Watchlist</h2>

  <!-- Genre filter -->
  <div class="mt-5">
    <label for="genreFilter" class="mb-2 block text-sm font-medium">
      Filter by genre
    </label>

    <select id="genreFilter"
      class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3">
      <option value="all">All Genres</option>
      <option value="Action">Action</option>
      <option value="Comedy">Comedy</option>
      <option value="Drama">Drama</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Animation">Animation</option>
      <option value="Documentary">Documentary</option>
      <option value="Horror">Horror</option>
    </select>
  </div>

  <!-- Watched status filter -->
  <div class="mt-4">
    <label for="statusFilter" class="mb-2 block text-sm font-medium">
      Filter by status
    </label>

    <select id="statusFilter"
      class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3">
      <option value="all">All Titles</option>
      <option value="watched">Watched</option>
      <option value="unwatched">Unwatched</option>
    </select>
  </div>

  <!-- Number of results -->
  <p id="resultCount" class="mt-4 text-sm text-slate-400"></p>

  <!-- JavaScript will place the cards here -->
  <div id="movieGrid" class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
  </div>

</section>

  </section>
  

  <!-- JAVASCRIPT -->
  <script src="movie.js">

  </script>

</body>
</html>
