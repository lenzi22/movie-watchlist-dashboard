
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Watchlist Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">

  <!-- LOGIN VIEW --> BY DAVID
  <section id="loginView"
    class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md rounded-2xl border border-slate-700
                bg-slate-900 p-8 shadow-2xl">

      <div class="mb-8 text-center">
        <div class="mb-4 text-5xl">🎬</div>

        <h1 class="text-3xl font-bold">
          Movie<span class="text-amber-400">Watch</span>
        </h1>

        <p class="mt-2 text-slate-400">
          Your personal movie collection
        </p>
      </div>

      <form id="loginForm" class="space-y-5">

        <div>
          <label for="email"
            class="mb-2 block text-sm font-medium">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3 outline-none
                   focus:border-amber-400"
          >
        </div>

        <div>
          <label for="password"
            class="mb-2 block text-sm font-medium">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-lg border border-slate-700
                   bg-slate-800 px-4 py-3 outline-none
                   focus:border-amber-400"
          >
        </div>

        <p id="errorMessage"
          class="hidden text-sm text-red-400"
          role="alert">
        </p>

        <button
          type="submit"
          class="w-full rounded-lg bg-amber-400 px-4 py-3
                 font-bold text-slate-950 transition
                 hover:bg-amber-300">
          Sign In
        </button>

      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Movie Watchlist Dashboard · Team Project
      </p>

    </div>
  </section>


  <!-- Charrlotte, Shukri and Nicholas
  <section id="dashboardView" class="hidden min-h-screen p-8">

    <h1 class="text-3xl font-bold">
      Welcome to your Movie Watchlist!
    </h1>

    <p class="mt-3 text-slate-400">
      Login successful. We will build the dashboard features here.
    </p>
    
<!-- Nicholas: Search movies -->
<div class="mt-6">
  <label for="searchInput"
  ``  class="mb-2 block text-sm font-medium">
    Search by title
  </label>

  <input
    type="search"
    id="searchInput"
    placeholder="Type a movie title..."
    class="w-full rounded-lg border border-slate-700
           bg-slate-800 px-4 py-3"
  >
</div>

<button
  type="button"
  id="clearFilters"
  class="mt-4 text-sm font-semibold text-amber-400">
  Clear Search and Filters
</button>

<!-- Nicholas: Add a new movie -->
<section class="mt-8 rounded-2xl border border-slate-800
                bg-slate-900 p-5">

  <h2 class="text-2xl font-bold">Add a New Title</h2>

  <form id="addTitleForm" class="mt-5 grid gap-4">

    <div>
      <label for="titleInput">Movie or Show Title</label>
      <input id="titleInput" type="text"
        required maxlength="100"
        class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
    </div>

    <div>
      <label for="genreInput">Genre</label>
      <select id="genreInput" required
        class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
        <option value="">Choose a genre</option>
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Drama">Drama</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Animation">Animation</option>
        <option value="Documentary">Documentary</option>
        <option value="Horror">Horror</option>
      </select>
    </div>

    <div>
      <label for="runtimeInput">Runtime in minutes</label>
      <input id="runtimeInput" type="number" min="1"
        step="1" required
        class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
    </div>

    <div>
      <label for="ratingInput">Rating (0–10)</label>
      <input id="ratingInput" type="number" min="0" max="10"
        step="0.1" value="0" required
        class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-3">
    </div>

    <label class="flex items-center gap-2">
      <input type="checkbox" id="watchedInput">
      I have already watched this title
    </label>

    <div class="flex gap-3">
      <button type="reset"
        class="rounded-lg border border-slate-700 px-5 py-3">
        Clear Form
      </button>

      <button type="submit"
        class="rounded-lg bg-amber-400 px-5 py-3
               font-bold text-slate-950">
        Add Title
      </button>
    </div>

    <p id="formMessage" aria-live="polite"></p>
  </form>
</section>


    <button
      id="logoutButton"
      class="mt-6 rounded-lg bg-amber-400 px-5 py-3
             font-bold text-slate-950 hover:bg-amber-300">
      Log Out
    </button>

  </section>


  <!-- JAVASCRIPT -->
  <script src="./movie.js"> </script>

</body>
</html>
